name: FNC probe (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fnc_probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download FNC pages and files
        run: |
          set -x
          D=data/coffee/colombia/probe; mkdir -p $D
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -sSL -A "$UA" -o $D/robots.txt -w "%{http_code} robots\n" https://federaciondecafeteros.org/robots.txt >> $D/log.txt 2>&1 || true
          curl -sSL -A "$UA" -o $D/estadisticas.html -w "%{http_code} est\n" https://federaciondecafeteros.org/estadisticas-cafeteras/ >> $D/log.txt 2>&1 || true
          curl -sSL -A "$UA" -o $D/publicaciones.html -w "%{http_code} pub\n" https://federaciondecafeteros.org/publicaciones/ >> $D/log.txt 2>&1 || true
          for u in \
            https://federaciondecafeteros.org/wp-content/uploads/2026/09/Precios-area-y-produccion-de-cafe-Noviembre-2026-1.xlsx \
            https://federaciondecafeteros.org/wp-content/uploads/2026/10/Exportaciones-Septiembre-2026.xlsx \
            https://federaciondecafeteros.org/wp-content/uploads/2026/11/10.-Informe-mensual-Octubre-2026-p.pdf \
            https://federaciondecafeteros.org/wp-content/uploads/2026/10/Informe-Expos-Septiembre-2026.pdf \
            https://federaciondecafeteros.org/wp-content/uploads/2026/03/precio_cafe.pdf \
            https://federaciondecafeteros.org/wp-content/uploads/2026/11/Noticias-Semanales-Semana-45.pdf ; do
            curl -sSL -A "$UA" -o "$D/$(basename $u)" -w "%{http_code} %{size_download} $u\n" "$u" >> $D/log.txt 2>&1 || true
          done
          cat $D/log.txt; ls -la $D
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/coffee/colombia/probe && git commit -m "FNC probe files" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 10; done
