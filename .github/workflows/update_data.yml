name: Brazil Trade — Monthly Data Update

on:
  schedule:
    - cron: "0 8 * * 1"   # Every Monday 08:00 UTC
  workflow_dispatch:
    inputs:
      years:
        description: "Years to fetch (space-separated e.g. '2025 2026'). Leave blank for auto."
        required: false
        default: ""

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true          # pull LFS files (exports.csv)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas urllib3

      - name: Run scraper
        run: |
          if [ -n "${{ github.event.inputs.years }}" ]; then
            python scraper.py --years ${{ github.event.inputs.years }}
          else
            python scheduler.py --force
          fi

      - name: Check if data changed
        id: diff
        run: |
          git diff --quiet data/ && echo "changed=false" >> $GITHUB_OUTPUT \
                                 || echo "changed=true"  >> $GITHUB_OUTPUT

      - name: Commit updated CSV
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PERIOD=$(python - <<'PYEOF'
          import pandas as pd
          from pathlib import Path
          csv = Path("data/exports.csv")
          if csv.exists():
              df = pd.read_csv(csv, usecols=["year","month"])
              if not df.empty:
                  idx = df["year"]*100 + df["month"]
                  row = df.loc[idx.idxmax()]
                  months = ["Jan","Feb","Mar","Apr","May","Jun",
                            "Jul","Aug","Sep","Oct","Nov","Dec"]
                  print(f"{months[int(row['month'])-1]} {int(row['year'])}")
          PYEOF
          )

          git add data/exports_2015on.csv data/countries.csv
          git commit -m "data: update through ${PERIOD:-$(date +%Y-%m)} [bot]"
          git push

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "CSV unchanged — no new MDIC data available yet."
