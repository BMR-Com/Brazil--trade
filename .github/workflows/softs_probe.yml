name: softs-probe
# Temporary: check ICE coffee certified-stock report URLs from GitHub runners.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/softs_probe.yml', 'scripts/probe_certs.py']
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python scripts/probe_certs.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          git add data/probe && git commit -qm "probe output: certs" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done || true
