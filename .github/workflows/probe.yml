name: probe-sugar
on:
  push:
    branches: [probe-sugar]
    paths: [probe/probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests pandas openpyxl websocket-client pdfplumber xlrd git+https://github.com/rongardF/tvdatafeed.git
      - run: python probe/probe.py > probe/out.txt 2>&1 || true
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -f probe/out.txt probe/seed
          git commit -m "probe output" && git push
