name: probe-sugar
on:
  push:
    branches: [probe-sugar]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pandas websocket-client git+https://github.com/rongardF/tvdatafeed.git
      - run: python probe/probe.py
