name: Weather — Brazil crop regions and ENSO

on:
  schedule:
    - cron: "40 10 * * *"     # daily, after the overnight model run
  push:
    branches: [wx]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests pandas numpy
      - run: python weather/scripts/weather.py
      - name: One-off backfill of the new Brazil quality series
        if: github.ref_name == 'wx'
        run: |
          pip install -q lxml html5lib beautifulsoup4
          python coffee/scripts/fetch.py --only brazil_new
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather/data coffee/data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "weather: refresh $(date -u +%F) [bot]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
