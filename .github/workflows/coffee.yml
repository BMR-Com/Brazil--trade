name: Coffee — data refresh and model build

on:
  schedule:
    - cron: "35 22 * * 1-5"    # weekdays after the ICE close
  push:
    branches: [main]
    paths: ['pipelines/coffee_certs.py', 'models/kc_spread_model.py', 'pipelines/brazil_physical.py', 'models/brazil_tender_parity.py', '.github/workflows/coffee.yml']
  workflow_dispatch:
    inputs:
      full:
        description: "Full history reload (physical price backfill)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coffee-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: pip install -q requests pandas numpy openpyxl lxml html5lib beautifulsoup4 websocket-client git+https://github.com/rongardF/tvdatafeed.git
      - name: Fetch
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            python coffee/scripts/fetch.py --full
          else
            python coffee/scripts/fetch.py
          fi
      - name: Brazil physical history (CEPEA files from inbox/, Notícias Agrícolas co-op and CEPEA copies if robots allow, BCB PTAX)
        id: step1
        continue-on-error: true
        timeout-minutes: 50
        run: pip install -q xlrd && python pipelines/brazil_physical.py
      - name: Brazil tender parity (blend cost in Antwerp vs exchange value)
        id: step2
        continue-on-error: true
        run: python -W ignore models/brazil_tender_parity.py
      - name: ICE certified stocks (daily report; first run backfills history)
        id: step3
        continue-on-error: true
        timeout-minutes: 40
        run: pip install -q xlrd && python pipelines/coffee_certs.py
      - name: Build
        run: if [ -f coffee/scripts/build.py ]; then python coffee/scripts/build.py; fi
      - name: Certs profile and delivery economics (fails the run on error)
        run: python -W ignore models/coffee_certs_profile.py
      - name: KC spread model against certified stocks (fails the run on error)
        run: python -W ignore models/kc_spread_model.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coffee/data data/coffee/ice_certs.csv data/coffee/certs_profile.json data/coffee/ico_groups_history.csv data/coffee/spread_model.json 2>/dev/null || true
          for f in data/coffee/brazil_physical_raw.csv data/coffee/brazil_physical_history.csv data/coffee/brazil_physical_meta.json data/coffee/cepea_robusta_history.csv data/coffee/usdbrl_ptax.csv data/coffee/cepea_arabica_history.csv data/coffee/tender_parity.json data/coffee/tender_parity_history.csv; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "coffee: data refresh $(date -u +%F) [bot]"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && ok=1 && break; git rebase --abort 2>/dev/null || true; sleep 8; done; [ -n "$ok" ] || { echo "::error::push failed"; exit 1; }
      - name: fail the run if any step above failed (steps keep going so the other data still updates, but failures are not hidden)
        if: always()
        run: |
          o="${{ join(steps.*.outcome, ' ') }}"
          if echo "$o" | grep -q failure || [ -s "$RUNNER_TEMP/failed" ]; then echo "::error::one or more steps failed (see the errors above): $o"; exit 1; fi
