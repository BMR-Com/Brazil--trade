name: tmp roll backfill (KC/CC contracts)
on:
  push:
    branches: [tmp/roll-backfill]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q pandas websocket-client requests git+https://github.com/rongardF/tvdatafeed.git
      - run: python tmp/backfill.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p tmp/out && gzip -c kc_cc_contracts.csv > tmp/out/kc_cc_contracts.csv.gz
          git add tmp/out && git commit -m "tmp: backfill output" && git push origin HEAD:tmp/roll-backfill
