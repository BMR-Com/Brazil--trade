name: tmp wasde archive crawl
on:
  push:
    branches: [tmp/roll-backfill]
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q pandas requests && sudo apt-get install -y -q poppler-utils >/dev/null
      - run: python tmp/wasde_crawl.py
      - run: for f in wout/txt/*.pdf; do [ -e "$f" ] && pdftotext -layout "$f" "${f%.pdf}.txt"; done; ls wout/txt | head -80
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p tmp/wout && cp -r wout/* tmp/wout/
          git add tmp/wout && git commit -m "tmp: wasde crawl output" && git push origin HEAD:tmp/roll-backfill
