name: tmp roll backfill (KC/CC contracts)
on:
  push:
    branches: [tmp/roll-backfill]
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q pandas websocket-client requests git+https://github.com/rongardF/tvdatafeed.git
      - run: python tmp/backfill.py
      - uses: actions/upload-artifact@v4
        with: {name: kc_cc_contracts, path: kc_cc_contracts.csv}
