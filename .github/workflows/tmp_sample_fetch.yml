name: tmp-sample-fetch
# temporary: fetch sample report files for parser tests (removed after use)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp_sample_fetch.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0" -o kc.xls https://www.ice.com/publicdocs/futures_us_reports/coffee/coffee_cert_stock_20261116.xls
          echo "B64START"; base64 -w 120 kc.xls; echo "B64END"
