name: tmp-sample-fetch
# temporary: fetch sample report files for parser tests (removed after use)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp_sample_fetch.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir s; cd s
          for d in 20261116 20261113 20261112; do
            curl -sSL -A "Mozilla/5.0" -o kc_$d.xls https://www.ice.com/publicdocs/futures_us_reports/coffee/coffee_cert_stock_$d.xls || true
            for p in cotton/cotton_cert_stock_$d.xls cotton/cotton_cert_stock_$d.pdf cotton/certified_stock_$d.xls; do
              curl -sSL -A "Mozilla/5.0" -o "ct_$(basename $p)" https://www.ice.com/publicdocs/futures_us_reports/$p || true
            done
          done
          ls -la; file *
      - uses: actions/upload-artifact@v4
        with: {name: s, path: s}
