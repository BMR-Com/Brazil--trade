name: Sugar — CEPEA Brazil crystal sugar (São Paulo and Santos FOB)
# One request a run to the CEPEA sugar indicator page (honest agent, robots.txt checked each run), weekdays after
# CEPEA publishes (~17:00 BRT), with a late backup. Manual run with backfill=true also pulls CEPEA's own series files.
on:
  workflow_dispatch:
    inputs:
      backfill: {description: 'also download the full CEPEA series files', type: boolean, default: false}
  schedule:
    - cron: '41 22 * * 1-5'
    - cron: '41 2 * * 2-6'
permissions: {contents: write}
concurrency: {group: cepea-sugar, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests pandas numpy openpyxl lxml xlrd
      - name: CEPEA sugar
        run: python pipelines/cepea_sugar_fetch.py ${{ inputs.backfill && '--backfill' || '' }}
      - name: commit
        run: |
          git config user.name "bmr-data-bot"; git config user.email "bot@users.noreply.github.com"
          [ -f sugar/data/cepea_sugar.csv ] && git add sugar/data/cepea_sugar.csv
          git diff --cached --quiet && exit 0
          git commit -q -m "CEPEA sugar indicators $(date -u +%F' '%H:%M)"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null || true; sleep 8; done; [ -n "$ok" ] || { echo "::error::push failed"; exit 1; }
