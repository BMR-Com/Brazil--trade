name: probe-ct
on: {push: {branches: [probe-ct]}, workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas git+https://github.com/rongardF/tvdatafeed.git
      - run: python probe/softs.py || true
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe; git commit -m "probe ct data" || true; git push || true
