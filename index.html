<nav class="comm">
  <button data-c="optsig" title="Weekly trade ideas from options and open interest">Trade ideas</button>
  <button data-c="overview" title="One coloured tile per market: overall read, fundamentals, fair value, recent events, technicals and levels, vol, seasonality, COT">Overview</button>
  <button class="on" data-c="cotton">Cotton</button>
  <button data-c="sugar">Sugar</button>

  <button data-c="seasonal" title="Seasonal trades, heat maps, spreads and seasonal charts">Seasonality</button>
  <button data-c="cotfull" title="CFTC Commitments of Traders desk">COT (full)</button>
  <button data-c="brexp" title="Brazil agricultural exports (MDIC/SECEX)">Brazil exports</button>
  <button data-c="delivery" title="Delivery period: notice dates, open interest left, spread vs carry, certs, on-call, options by strike">Delivery</button>

<script>
const SECTIONS = ['overview', 'optsig', 'cotton', 'sugar', 'coffee', 'cocoa', 'markets', 'options', 'primer', 'seasonal', 'cotfull', 'brexp', 'delivery', 'status'];
// Options primer: standalone page primer/options.html in a frame; #primer/<tab> deep-links
const Primer = {
  show() {
    const f = $('#primer-frame'), t = (location.hash.match(/^#primer\/(\w+)/) || [])[1];
    if (!f.src) f.src = 'primer/options.html?v=20261126a' + (t ? '#' + t : '');
    if (!location.hash.startsWith('#primer')) history.replaceState(null, '', '#primer');
    window.scrollTo(0, 0);
  }
};
window.addEventListener('message', e => {
  const pf = document.getElementById('primer-frame');
  if (pf && e.source === pf.contentWindow && e.data && e.data.primerTab) history.replaceState(null, '', '#primer/' + e.data.primerTab);
});
const CotFull = {
  show() {
    const f = $('#cot-frame'), t = (location.hash.match(/^#cot\/(\w+)/) || [])[1];
    if (!f.src) f.src = 'cot/index.html' + (t ? '#' + t : '');
    if (!location.hash.startsWith('#cot')) history.replaceState(null, '', '#cot');
    window.scrollTo(0, 0);
  }
};
$$('nav.comm button[data-c]').forEach(b => b.onclick = () => {
  $$('nav.comm button').forEach(x => x.classList.toggle('on', x === b));
  SECTIONS.forEach(id => $('#' + id).style.display = id === b.dataset.c ? '' : 'none');
  const c = b.dataset.c;
  try {
    if (c === 'overview') Overview.show();
    else if (c === 'optsig') OptSig.show();
    else if (c === 'cotton') Cotton.show();
    else if (c === 'sugar') Softs.show('sugar');
    else if (c === 'coffee') Softs.show('coffee');
    else if (c === 'cocoa') Cocoa.show();
    else if (c === 'markets') Markets.show();
    else if (c === 'options') Options.show();
    else if (c === 'seasonal') Seasonal.show();
    else if (c === 'cotfull') CotFull.show();
    else if (c === 'primer') Primer.show();
    else if (c === 'status') Status.show();
    else if (c === 'delivery') DeskWatch.showDelivery();
    else if (c === 'brexp') { const f = $('#brexp-frame'); if (!f.src) f.src = 'brazil_exports.html'; history.replaceState(null, '', '#brexp'); }
  } catch (e) { $('#' + c).innerHTML = '<div class="card"><p class="note">This section failed to load.</p></div>'; console.error(e); }
});
const h = location.hash;
const pick = h === '#overview' ? 'overview' : h.startsWith('#delivery') ? 'delivery' : h === '#ideas' ? 'optsig' : h.startsWith('#su') ? 'sugar' : h.startsWith('#kc') ? 'coffee' : h.startsWith('#cc-') ? 'cocoa' : h.startsWith('#cot') ? 'cotfull' : h === '#markets' ? 'markets'
  : h.startsWith('#primer') ? 'primer' : h.startsWith('#options') ? 'options' : h.startsWith('#seasonal') ? 'seasonal' : h === '#brexp' ? 'brexp' : h === '#status' ? 'status' : 'cotton';
$('nav.comm button[data-c="' + pick + '"]').click();
Status.strip($('#statusStrip'));
</script>
