<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Softs Desk · BMR-Com</title>
<meta name="description" content="BMR-Com research desk for ICE softs: cotton, sugar and coffee, with USDA balance sheets, origin data, COT positioning, options, spreads and seasonality. Research use only.">
<link rel="stylesheet" href="assets/style.css?v=20261101a">
<link rel="stylesheet" href="assets/esr.css?v=20261101a">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header>
  <h1>BMR-Com · Softs Desk</h1>
  <div class="meta" id="meta">Cotton, sugar and coffee · USDA / CFTC / ICE / UNICA / Cecafé / ICO data</div>
</header>
<nav class="comm">
  <button class="on" data-c="cotton">Cotton</button>
  <button data-c="sugar">Sugar</button>
  <button data-c="coffee">Coffee</button>
  <button data-c="markets">Markets &amp; macro</button>
  <button data-c="options">Options pricer</button>
  <button data-c="seasonal" title="Seasonal trades, heat maps, spreads and seasonal charts">Seasonality</button>
  <button data-c="cotfull" title="CFTC Commitments of Traders desk">COT (full)</button>
  <button data-c="brexp" title="Brazil agricultural exports (MDIC/SECEX)">Brazil exports</button>
</nav>

<section id="cotton"></section>
<section id="sugar" style="display:none"></section>
<section id="coffee" style="display:none"></section>
<section id="markets" style="display:none"></section>
<section id="options" style="display:none"></section>
<section id="seasonal" style="display:none"></section>
<section id="cotfull" style="display:none;padding:0"><iframe id="cot-frame" title="COT positioning desk" style="display:block;width:100%;height:calc(100vh - 92px);min-height:640px;border:0;background:#1e3c72"></iframe></section>
<section id="brexp" style="display:none;padding:0"><iframe id="brexp-frame" title="Brazil exports" style="display:block;width:100%;height:calc(100vh - 92px);min-height:640px;border:0"></iframe></section>
<footer>Data: USDA (WASDE, PSD, FAS, NASS, AMS, FSA), CFTC, ICE, UNICA, Cecafé, ICO, MDIC/SECEX. Prices and positions as of the dates shown. Research use only; not investment advice.</footer>
<script src="assets/lib.js?v=20261101a"></script>
<script src="assets/specs.js?v=20261101a"></script>
<script src="assets/playbook.js?v=20261101a"></script>
<script src="assets/tech.js?v=20261101a"></script>
<script src="assets/cotdesk.js?v=20261101a"></script>
<script src="assets/intel.js?v=20261101a"></script>
<script src="assets/esr.js?v=20261101a"></script>
<script src="assets/wasde.js?v=20261101a"></script>
<script src="assets/rv.js?v=20261101a"></script>
<script src="assets/markets.js?v=20261101a"></script>
<script src="assets/geo.js?v=20261108f"></script>
<script src="assets/options.js?v=20261101a"></script>
<script src="assets/balance.js?v=20261101a"></script>
<script src="assets/seasonal.js?v=20261101a"></script>
<script src="assets/basis.js?v=20261101a"></script>
<script src="assets/china.js?v=20261101a"></script>
<script src="assets/price_outlook.js?v=20261101a"></script>
<script src="assets/india.js?v=20261101a"></script>
<script src="assets/cotton_loan.js?v=20261101a"></script>
<script src="assets/ams_review.js?v=20261101a"></script>
<script src="assets/cotton.js?v=20261109e"></script>
<script src="assets/sugar.js?v=20261104b"></script>
<script src="assets/coffee.js?v=20261104b"></script>
<script src="assets/softs.js?v=20261103a"></script>
<script>
const SECTIONS = ['cotton', 'sugar', 'coffee', 'markets', 'options', 'seasonal', 'cotfull', 'brexp'];
const CotFull = {
  show() {
    const f = $('#cot-frame'), t = (location.hash.match(/^#cot\/(\w+)/) || [])[1];
    if (!f.src) f.src = 'cot/index.html' + (t ? '#' + t : '');
    if (!location.hash.startsWith('#cot')) history.replaceState(null, '', '#cot');
    window.scrollTo(0, 0);
  }
};
$$('nav.comm button[data-c]').forEach(b => b.onclick = () => {
  $$('nav.comm button').forEach(x => x.classList.toggle('on', x === b));
  SECTIONS.forEach(id => $('#' + id).style.display = id === b.dataset.c ? '' : 'none');
  const c = b.dataset.c;
  try {
    if (c === 'cotton') Cotton.show();
    else if (c === 'sugar') Softs.show('sugar');
    else if (c === 'coffee') Softs.show('coffee');
    else if (c === 'markets') Markets.show();
    else if (c === 'options') Options.show();
    else if (c === 'seasonal') Seasonal.show();
    else if (c === 'cotfull') CotFull.show();
    else if (c === 'brexp') { const f = $('#brexp-frame'); if (!f.src) f.src = 'brazil_exports.html'; history.replaceState(null, '', '#brexp'); }
  } catch (e) { $('#' + c).innerHTML = '<div class="card"><p class="note">This section failed to load.</p></div>'; console.error(e); }
});
const h = location.hash;
const pick = h.startsWith('#su') ? 'sugar' : h.startsWith('#kc') ? 'coffee' : h.startsWith('#cot') ? 'cotfull' : h === '#markets' ? 'markets'
  : h.startsWith('#options') ? 'options' : h.startsWith('#seasonal') ? 'seasonal' : h === '#brexp' ? 'brexp' : 'cotton';
$('nav.comm button[data-c="' + pick + '"]').click();
</script>
</body>
</html>
